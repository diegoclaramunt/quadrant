<div class="shell">
  <header class="top">
    <a routerLink="/board" class="brand" (click)="moreOpen = false"
      ><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="1" y="1" width="8" height="8" rx="2" fill="var(--q1-ink)" />
        <rect x="11" y="1" width="8" height="8" rx="2" fill="var(--q2-ink)" />
        <rect x="1" y="11" width="8" height="8" rx="2" fill="var(--q3-ink)" />
        <rect
          x="11"
          y="11"
          width="8"
          height="8"
          rx="2"
          fill="var(--q4-ink)"
        /></svg
      >Quadrant</a
    >
    <nav class="nav" aria-label="Principal">
      @for (link of primaryLinks; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (click)="moreOpen = false"
        >{{ link.label }}</a
      >
      }
      <div class="more">
        <button
          class="nav-more"
          type="button"
          [attr.aria-expanded]="moreOpen"
          aria-controls="planning-navigation"
          (click)="moreOpen = !moreOpen"
        >
          Más
        </button>
        @if (moreOpen) {
        <div
          id="planning-navigation"
          class="more-menu"
          tabindex="-1"
          (keydown.escape)="moreOpen = false"
        >
          <span class="more-title">Planificación semanal</span>
          @for (link of planningLinks; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            (click)="moreOpen = false"
            >{{ link.label }}</a
          >
          }
        </div>
        }
      </div>
    </nav>
  </header>
  <main class="main">
    <router-outlet />
  </main>
</div>
