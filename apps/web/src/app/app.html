<div class="shell">
  <header class="top">
    <a routerLink="/inbox" class="brand">Quadrant</a>
    <p class="tagline">Captura, decide, planifica por bloques.</p>
  </header>
  <div class="layout">
    <nav class="nav" aria-label="Principal">
      @for (link of links; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
      }
    </nav>
    <main class="main">
      <router-outlet />
    </main>
  </div>
</div>
